<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
<head>
  <meta charSet="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tower — Create Account</title>
  <meta name="description" content="Create your Tower account and start sharing content with the world."/>
  <link rel="icon" href="/favicon.ico" sizes="256x256" type="image/x-icon"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body class="flex min-h-full flex-col bg-[#05060a] text-zinc-100">
  <div class="mx-auto flex min-h-full max-w-md flex-1 flex-col justify-center px-6 py-16">
    <div class="tower-enter space-y-6">
      <div>
        <h1 class="text-2xl font-semibold text-white">Create Account</h1>
        <p class="mt-1 text-sm text-zinc-400">Join Tower and start sharing your content.</p>
      </div>
      <form id="signupForm" class="space-y-4 rounded-2xl border border-white/10 bg-zinc-950/60 p-6">
        <div class="space-y-4">
          <div>
            <label class="block space-y-1 text-sm text-zinc-300">
              <span>Username</span>
              <input
                type="text"
                id="username"
                autoComplete="username"
                class="w-full rounded-xl border border-white/10 bg-black/40 px-3 py-2 text-zinc-100 focus:border-cyan-400/60"
                placeholder="Choose a username"
                required
              />
            </label>
          </div>
          <div>
            <label class="block space-y-1 text-sm text-zinc-300">
              <span>Age</span>
              <input
                type="number"
                id="age"
                min="13"
                max="120"
                class="w-full rounded-xl border border-white/10 bg-black/40 px-3 py-2 text-zinc-100 focus:border-cyan-400/60"
                placeholder="Your age"
                required
              />
            </label>
          </div>
          <div>
            <label class="block space-y-1 text-sm text-zinc-300">
              <span>Password</span>
              <input
                type="password"
                id="password"
                autoComplete="new-password"
                class="w-full rounded-xl border border-white/10 bg-black/40 px-3 py-2 text-zinc-100 focus:border-cyan-400/60"
                placeholder="Create a password"
                required
              />
            </label>
          </div>
          <div>
            <label class="block space-y-1 text-sm text-zinc-300">
              <span>Confirm Password</span>
              <input
                type="password"
                id="confirmPassword"
                autoComplete="new-password"
                class="w-full rounded-xl border border-white/10 bg-black/40 px-3 py-2 text-zinc-100 focus:border-cyan-400/60"
                placeholder="Confirm your password"
                required
              />
            </label>
          </div>
          <div>
            <label class="block text-sm text-zinc-300">
              <span>Topics (choose 3-5)</span>
              <select id="topics" multiple class="w-full rounded-xl border border-white/10 bg-black/40 px-3 py-2 text-zinc-100 focus:border-cyan-400/60">
                <option value="technology">Technology</option>
                <option value="art">Art</option>
                <option value="music">Music</option>
                <option value="gaming">Gaming</option>
                <option value="sports">Sports</option>
                <option value="science">Science</option>
                <option value="travel">Travel</option>
                <option value="food">Food</option>
                <option value="fashion">Fashion</option>
                <option value="movies">Movies</option>
                <option value="books">Books</option>
                <option value="fitness">Fitness</option>
                <option value="photography">Photography</option>
                <option value="writing">Writing</option>
                <option value="coding">Coding</option>
                <option value="design">Design</option>
                <option value="business">Business</option>
              </select>
            </label>
          </div>
          <div id="error-message" class="text-sm text-rose-300 hidden"></div>
          <button
            type="submit"
            id="signupButton"
            class="w-full rounded-full bg-gradient-to-r from-violet-600 to-cyan-500 py-2.5 text-sm font-semibold text-white"
          >
            Create Account
          </button>
        </div>
        <p class="text-center text-sm text-zinc-500">
          Already have an account? 
          <a href="/login.html" class="text-cyan-300 hover:text-cyan-200">Sign in</a>
        </p>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
