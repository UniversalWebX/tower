<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
<head>
  <meta charSet="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tower — Login</title>
  <meta name="description" content="Sign in to Tower to access your personalized feed and connect with others."/>
  <link rel="icon" href="/favicon.ico" sizes="256x256" type="image/x-icon"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body class="flex min-h-full flex-col bg-[#05060a] text-zinc-100">
  <div class="mx-auto flex min-h-full max-w-md flex-1 flex-col justify-center px-6 py-16">
    <div class="tower-enter space-y-6">
      <div>
        <h1 class="text-2xl font-semibold text-white">Welcome back</h1>
        <p class="mt-1 text-sm text-zinc-400">Sign in to Tower.</p>
      </div>
      <form id="loginForm" class="space-y-4 rounded-2xl border border-white/10 bg-zinc-950/60 p-6">
        <div class="space-y-4">
          <div>
            <label class="block space-y-1 text-sm text-zinc-300">
              <span>Username</span>
              <input
                type="text"
                id="username"
                autoComplete="username"
                class="w-full rounded-xl border border-white/10 bg-black/40 px-3 py-2 text-zinc-100 focus:border-cyan-400/60"
                placeholder="Enter your username"
              />
            </label>
          </div>
          <div>
            <label class="block space-y-1 text-sm text-zinc-300">
              <span>Password</span>
              <input
                type="password"
                id="password"
                autoComplete="current-password"
                class="w-full rounded-xl border border-white/10 bg-black/40 px-3 py-2 text-zinc-100 focus:border-cyan-400/60"
                placeholder="Enter your password"
              />
            </label>
          </div>
          <div id="error-message" class="text-sm text-rose-300 hidden"></div>
          <button
            type="submit"
            id="loginButton"
            class="w-full rounded-full bg-gradient-to-r from-violet-600 to-cyan-500 py-2.5 text-sm font-semibold text-white"
          >
            Sign in
          </button>
        </div>
        <p class="text-center text-sm text-zinc-500">
          New here? 
          <a href="/signup.html" class="text-cyan-300 hover:text-cyan-200">Create an account</a>
        </p>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
