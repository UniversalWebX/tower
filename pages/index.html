<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
<head>
  <meta charSet="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tower</title>
  <meta name="description" content="Tower ranks video posts using tags, your interests, and age fit, with optimized batched feeds and chat."/>
  <link rel="icon" href="/favicon.ico" sizes="256x256" type="image/x-icon"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body class="flex min-h-full flex-col bg-[#05060a] text-zinc-100">
  <!-- Navigation -->
  <header class="sticky top-0 z-40 border-b border-white/10 bg-black/40 backdrop-blur-xl">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3">
      <div class="flex items-center gap-4">
        <a href="/feed" class="text-sm font-semibold tracking-[0.22em] text-zinc-100">
          TOWER
        </a>
        <nav class="flex items-center gap-1">
          <a href="/feed" class="relative px-3 py-1.5 text-sm font-medium text-zinc-300">
            <span>Racks</span>
          </a>
          <a href="/create" class="relative px-3 py-1.5 text-sm font-medium text-zinc-300">
            <span>Upload</span>
          </a>
          <a href="/chats" class="relative px-3 py-1.5 text-sm font-medium text-zinc-300">
            <span>Chats</span>
          </a>
        </nav>
        <button
          type="button"
          class="rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-zinc-200"
        >
          Sign out
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="mx-auto flex w-full max-w-5xl flex-1 flex-col justify-center px-6 py-20">
    <div class="space-y-6">
      <h1 class="text-2xl font-semibold tracking-tight text-zinc-50">Your feed</h1>
      <p class="max-w-2xl text-sm text-zinc-400">
        desc go here.
      </p>
      <div id="feed-container">
        <!-- Posts will be loaded here via JavaScript -->
        <div class="text-center py-8">
          <p class="text-zinc-500">Loading posts...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto py-6 text-center text-sm text-zinc-500">
    <p>&copy; 2026 Tower. All rights reserved.</p>
  </footer>

  <!-- Scripts -->
  <script src="/app.js"></script>
</body>
</html>
